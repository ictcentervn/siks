  html{scroll-behavior:smooth;scroll-padding-top:82px}
  body{margin:0;color:var(--text);background:#f7f9fc;font-family:'Noto Sans KR','DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

  .subheading{font:800 11px 'DM Sans',sans-serif;color:#5379ad;letter-spacing:.15em;margin-bottom:17px}

  .film-titleline span{font:800 11px 'DM Sans',sans-serif;color:#567dad}
  .theme-line{display:grid;grid-template-columns:14px 1fr 20px;gap:16px;align-items:center;border-bottom:1px solid #d4deeb;padding:18px 0}

  .backup{font-size:12px;color:#70849b;margin-top:22px}

  .submission ol{margin:0;padding:0;list-style:none}

  .lower-layout{display:grid;grid-template-columns:1fr 1fr;gap:64px}

  .places{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .place{background:#e9f0f8;border-radius:7px;padding:17px;display:flex;justify-content:space-between;align-items:center}
  .place b{font-size:14px}.place small{font:800 11px 'DM Sans',sans-serif;color:#7695bd}
  .score-note{margin-top:18px;font-size:12px;line-height:1.8;color:#657b97}
  .rubric{margin-top:31px;border-top:2px solid #244975}

  .safety-card{background:white;padding:29px 28px;border:1px solid #e0e7f1;border-radius:12px}

  footer{background:#f9fbfe;padding:29px 0}

  .footbuttons button{border:none;background:none;font-size:12px;font-weight:800;color:#345e96}

      ${section(`<div class="section-heading"><h2>${t.scoreTitle}</h2><p>${t.scoreDesc}</p></div><div class="lower-layout"><div><h3>${t.placesTitle}</h3><div class="places">${t.places.map((s,i)=>`<div class="place"><small>${String(i+1).padStart(2,'0')}</small><b>${s}</b></div>`).join('')}</div><p class="score-note">${t.scoreNote}</p><h3 class="rubric-title">${t.rubricTitle}</h3><ul class="rubric">${t.rubric.map(r=>`<li><span>${r[0]}</span><strong>${r[1]}</strong></li>`).join('')}</ul></div><div class="safety-card"><h3>${t.safetyTitle}</h3><ul>${t.safety.map(s=>`<li><span class="check">✓</span><span>${s}</span></li>`).join('')}</ul><div class="disclaimer">${t.notice}</div></div></div>`,'safety')}

    </main><footer><div class="wrapper footer-inner"><div><strong>SIKS ICT EXPO 2026 · FOUR HOUSE CHALLENGE</strong><small>${t.privacy}</small></div><div class="footbuttons"><button id="print">${t.print} ↗</button><button id="topbtn">${t.top} ↑</button></div></div></footer>`;
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{const newLang=b.getAttribute('data-lang');if(newLang!==lang){lang=newLang;mobileMenu=false;render();}}));
    document.getElementById('menu').addEventListener('click',()=>{mobileMenu=!mobileMenu;document.querySelector('#navlinks').classList.toggle('is-open',mobileMenu);document.getElementById('menu').setAttribute('aria-expanded',String(mobileMenu));document.getElementById('menu').textContent=mobileMenu?'×':'☰';});
    document.querySelectorAll('.navlinks a').forEach(link=>link.addEventListener('click',()=>{mobileMenu=false;document.querySelector('#navlinks').classList.remove('is-open');document.getElementById('menu').textContent='☰';}));
    document.getElementById('print').addEventListener('click',()=>window.print());
    document.getElementById('topbtn').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  }
  render();
  </script>
</body>
</html>
